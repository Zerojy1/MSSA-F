# ===== MSSA-Rut full experiment configuration (master switch: run_all.py) =====
data_dir: data
out_root: results
device: cpu            # "cuda" works for the MSSA model; problem is small, CPU is usually fast enough
seeds: [0, 1, 2, 3, 4]

model:
  use_deflection: true          # FWD centre deflection (50 kN) as reversible driver / discrepancy feature
  fwd_load_kN: 50
  sublayers: {first_max_mm: 40, first_sub_mm: 20, deep_sub_mm: 100}   # verify against JTG D50-2017 App. B
  # Asphalt modulus at 20 C per AC slot (MPa). Only RATIOS enter Odemark depth -> absolute level irrelevant.
  # Order: AC13_I_SBS, AC13_II_SBS, SMA13, PAC13, AC20_AH30, AC20_SBS, AC20_AH50,
  #        AC25_AH30, AC25_AH50, AC25_AH70, AC25_Re_AH70, AC10_SBS   (typical values; assumption)
  E20_slot: [10000, 10000, 9500, 7000, 13000, 11500, 11000, 13500, 11500, 10500, 11000, 8000]
  T_bar_init: 12.0
  damp_mm_init: 300.0
  cE_init: 0.06
  sig_m_init: 0.15
  hidden: 32
  g_max: 1.5
  use_rate_state: true          # structure-specific log-rate state theta (v2)
  sig_theta_init: 0.4
  q_theta_init: 0.02
  datum_random_walk: true       # v3: datum d0 as a random walk (local-level component), q_d0 learned
  q_d0_init: 0.03

train:
  epochs: 400
  patience: 8
  val_every: 10
  val_horizon: 6
  n_inner_val: 2                # inner validation structures drawn from the training fold (no test leakage)
  lr_phys: 0.01
  lr_nn: 0.002
  lambda_ms: 1.0
  lambda_mse: 1.0               # v2: point-accuracy term (one-step + multi-step mean squared error)
  ms_horizon: 12
  ms_origins: 24
  lambda_u: 0.5
  lambda_cls: 0.5
  lambda_toff: 0.05
  lambda_g: 0.05
  grad_clip: 5.0

baselines:
  gbm_trees: 400
  gbm_max_rows: 80000
  jtg_nfev: 200
  enkf_members: 100
  seq_window: 16
  seq_horizon: 12
  seq_epochs: 60
  seq_train_k: [1, 2, 4]

experiments:
  run: [E0, E1E2, E3, E5, E6_ablation]     # master switch: remove items to skip
  protocols:
    horizons: [1, 3, 6, 12]
    sparse_k: [1, 2, 4, 8]
    early_fracs: [0.2, 0.4, 0.6]
    thresholds: [8.0, 10.0]
    counterfactual: true
  hybrid:                       # MSSA-H residual corrector (cross-fitted on training structures only)
    n_crossfit: 3
    crossfit_epochs: 400
    pairs_per_structure: 400
    trees: 500
    max_depth: 4
    # mssa_h = corrector constrained non-decreasing in load increment / temperature; mssa_h:free = unconstrained
    train_k: [2, 4, 8]
    train_early: [0.2, 0.4, 0.6]
  save_pred_models: [mssa, gbm_residual]   # all-protocol predictions saved -> post-hoc mssa_ens / gbm_ens / fusion
  fpt_mc: true
  fpt_samples: 500
  E0:
    noise_levels: [0.10, 0.20]
    truth: {beta: 0.40, gamma: 3.2, phi: 0.6, sig_r: 0.08, kappa_T: 0.3, q_rel: 0.2, mu_d0: 1.5, u_sd: 0.25, log_scale_shift: 0.0}
  E1E2:
    models: [mssa, persistence, gbm_residual, jtg_global, jtg_enkf, lstm, patchtst]
  E3:
    models: [mssa, persistence, gbm_residual, jtg_enkf]
  E5:
    hide_materials: true
    n_inner_val: 2
  E6_ablation:
    variants: [no_rate, no_rw, no_disc, no_rev, no_proj, no_defl, fixed_mat, neural_ssm, no_ms]
